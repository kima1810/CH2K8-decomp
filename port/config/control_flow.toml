# Retail USA default.xex, SHA-256 71e8983d1cc009e485696aad19b5fa4b4661761870e2c8972717b932c1e4be36.
# [CONFIRMED] Bounds and inline table targets inspected with Ghidra/Xenon360.
# See docs/findings/2026-10-30-native-build-and-control-flow.md for evidence.
# End addresses are exclusive. Keep all blocks in their owning function so
# codegen resolves branches to labels that it already emits.

[functions]
0x84B8A368 = { end = 0x84B8A608 }
0x84C208D8 = { end = 0x84C20A4C }
0x84C20A50 = { end = 0x84C20AE8 }
0x84C20AE8 = { end = 0x84C20B90 }
0x84D40778 = { end = 0x84D40850 }
0x84DAB6E8 = { end = 0x84DAB720 }

# The index is r10 before rlwinm scales it into r0. These are four
# consecutive big-endian pointers immediately following each bctr.
[[switch_tables]]
address = 0x84C20904
register = 10
labels = [0x84C20A48, 0x84C20A48, 0x84C20918, 0x84C2092C]

[[switch_tables]]
address = 0x84C20964
register = 10
labels = [0x84C20978, 0x84C209AC, 0x84C209E0, 0x84C20A48]

[[switch_tables]]
