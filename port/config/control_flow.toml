[[switch_tables]]
address = 0x84D3688C
register = 7
labels = [0x84D368B8, 0x84D368B8, 0x84D368C0, 0x84D368C8, 0x84D368B8,
          0x84D368B8, 0x84D368C0, 0x84D368C8, 0x84D368D0, 0x84D368D0]

# [CONFIRMED] Same equality-skip idiom in the neighboring startup layout loop;
# r27 still reaches eight and nine. Both use the final li r31,4 case body.
[[switch_tables]]
address = 0x84D3AD78
register = 27
labels = [0x84D3ADA4, 0x84D3ADA4, 0x84D3ADAC, 0x84D3ADB4, 0x84D3ADA4,
          0x84D3ADA4, 0x84D3ADAC, 0x84D3ADB4, 0x84D3ADBC, 0x84D3ADBC]

# [CONFIRMED] Native startup next reached the single-case fallback in this
