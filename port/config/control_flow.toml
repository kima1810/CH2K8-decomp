[[switch_tables]]
address = 0x84C20B14
register = 10
labels = [0x84C20B28, 0x84C20B8C, 0x84C20B3C, 0x84C20B8C]

# Six inline pointers; the unscaled selector is r3, not r0 or CTR.
[[switch_tables]]
address = 0x84D407B4
register = 3
labels = [0x84D40838, 0x84D407D0, 0x84D407E8, 0x84D407F4, 0x84D407DC, 0x84D40800]

# [CONFIRMED] Native startup reached the default trap when only case 0 was
# generated. Five consecutive pointers end at the first case (0x84B8A424).
[[switch_tables]]
address = 0x84B8A40C
register = 11
labels = [0x84B8A46C, 0x84B8A424, 0x84B8A4AC, 0x84B8A4F4, 0x84B8A53C]

# [CONFIRMED] The owning loop reaches r7=8 and r7=9. Equality checks that skip
